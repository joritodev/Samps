name: Migrar banco de produção

# Manual: só roda quando alguém clica em "Run workflow" na aba Actions e digita
# "aplicar". Aplica as migrações pendentes (`prisma migrate deploy`): só cria o
# que falta, na ordem, e não apaga dados.
#
# Configuração (uma vez): em Settings > Secrets and variables > Actions, crie o
# secret PRODUCTION_DATABASE_URL com a URL de conexão DIRETA do banco de
# produção (sem pooler). Se quiser exigir aprovação de alguém antes de rodar,
# crie o Environment "production-db" em Settings > Environments, ative
# "Required reviewers" e guarde o secret lá.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite "aplicar" para confirmar que quer migrar o banco de PRODUÇÃO'
        required: true
        type: string

permissions:
  contents: read

# Duas execuções ao mesmo tempo disputariam o lock do banco.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    # Só a partir da master: nunca migra produção com código de branch.
    if: github.ref == 'refs/heads/master' && inputs.confirmar == 'aplicar'
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        # O postinstall roda `prisma generate`, que exige a variável mas não conecta.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: npm ci

      - name: Conferir o secret
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::O secret PRODUCTION_DATABASE_URL não está configurado."
            exit 1
          fi
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-zA-Z]+://[^@]*@([^/:?]+).*#\1#')
          case "$host" in
            *-pooler*)
              echo "::warning::A URL usa o endereço com pooler ($host). Para migrar, use o endereço direto (o mesmo, sem '-pooler')."
              ;;
          esac

      - name: Acordar o banco
        # Bancos serverless (Neon) suspendem quando ociosos: a primeira conexão
        # pode falhar enquanto ele acorda. Tenta de novo antes de desistir.
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          case "$DATABASE_URL" in
            *connect_timeout=*) ;;
            *\?*) DATABASE_URL="${DATABASE_URL}&connect_timeout=30" ;;
            *) DATABASE_URL="${DATABASE_URL}?connect_timeout=30" ;;
          esac
          export DATABASE_URL
          for attempt in 1 2 3 4 5 6; do
            if echo 'SELECT 1;' | npx prisma db execute --stdin --schema prisma/schema.prisma; then
              exit 0
            fi
            echo "Tentativa $attempt de 6 falhou; esperando 10 s."
            sleep 10
          done
          echo "::error::Não foi possível conectar ao banco. Confira se a URL é a direta (sem pooler), se o banco está ativo e se não há lista de IPs permitidos bloqueando o GitHub."
          exit 1

      - name: Migrações pendentes (antes)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        # `status` sai com código 1 quando há migração pendente: é informativo aqui.
        run: npx prisma migrate status || true

      - name: Aplicar migrações
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          case "$DATABASE_URL" in
            *connect_timeout=*) ;;
            *\?*) DATABASE_URL="${DATABASE_URL}&connect_timeout=30" ;;
            *) DATABASE_URL="${DATABASE_URL}?connect_timeout=30" ;;
          esac
          export DATABASE_URL
          npx prisma migrate deploy

      - name: Migrações pendentes (depois)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate status
