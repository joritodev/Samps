name: Security

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan de segredos
        # Pin imutável (v3.96.0) — não usar @main.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          version: "3.96.0"
          extra_args: --only-verified

  audit:
    runs-on: ubuntu-latest
    env:
      # prisma generate no postinstall exige DATABASE_URL mesmo sem conectar.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Next 14.x ainda tem highs sem patch no major (ver docs/superpowers/notas/2026-08-dependencias.md).
      # O job reporta o audit mas não bloqueia merge até o upgrade para Next 16 (Fase 3/4).
      - name: npm audit (producao)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
